name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Clear buildozer caches
        run: |
          rm -rf ~/.buildozer || true
          rm -rf .buildozer || true

      - name: Build APK with pip patcher
        run: |
          (while true; do
            for v in $(find .buildozer -type d -name venv 2>/dev/null); do
              if [ -f "$v/bin/pip" ] && [ ! -f "$v/.patched" ]; then
                echo "Patching pip in $v"
                "$v/bin/pip" install --quiet "pip<24.1" 2>&1 | tail -3 || true
                touch "$v/.patched"
                echo "Pip patched to <24.1"
              fi
            done
            sleep 1
          done) &
          PATCHER=$!
          trap "kill $PATCHER 2>/dev/null || true" EXIT
          yes | buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FIT-Download-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30
