name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install git+https://github.com/kivy/buildozer.git
          pip install cython==0.29.36

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Clean Buildozer cache
        run: |
          rm -rf ~/.buildozer/android/packages
          rm -rf ~/.buildozer/android/platform
          rm -rf .buildozer
          echo 'Full Buildozer cache cleared'

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FIT-Download-apk
          path: bin/*.apk
          retention-days: 30
